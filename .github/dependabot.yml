version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 10
    # @cloudflare/vitest-plugin (the renamed vitest-pool-workers) peers vitest at
    # ^4.1.0 || ^5.0.0 since 1.4.x, so vitest majors install again (#1097 was the
    # ERESOLVE when it peered a single major). Bump vitest + vitest-plugin
    # together if a future plugin narrows the range. The plugin also pins wrangler
    # EXACTLY (1.4.7 → wrangler 4.152.0): keep wrangler in the `cloudflare` group
    # below so the two move in one PR, and keep the root's wrangler different from
    # the sidecars' so each sidecar keeps its nested install (infra-probe audit).
    ignore:
      # cf is pinned exactly in every sidecar; the audit 'pins cf exactly to the version measured for function-form configs' blocks a blind bump (dependabot #1275 closed 2026-10-23).
      - dependency-name: 'cf'
    groups:
      cloudflare:
        patterns:
          - '@cloudflare/*'
          - 'wrangler'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # default-days ONLY: github-actions does not support semver-*-days. Dependabot
    # rejects the WHOLE file over them ("not supported for the package ecosystem
    # 'github-actions'"; see the '.github/dependabot.yml' check run), and no npm
    # cooldown or the vitest-major ignore above was honored from #803 (2026-08-27)
    # until this was fixed (SQ-263, PR #1169 got through).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # github/codeql-action/init and .../analyze are ONE action published from one
      # repo, and they must run at the SAME version: init writes a config file
      # stamped with its own version, and analyze hard-fails reading it back with
      # "Loaded a configuration file for version 'X', but running version 'Y'".
      # Dependabot keys the github-actions ecosystem on the full action path, so
      # without this group it opens a separate PR per sub-action — each one
      # internally version-mismatched and therefore red on arrival. This split has
      # recurred on every codeql-action release (v4.37.0 #499/#500,
      # v4.37.3 #536/#538, v4.37.4 #627/#628). Grouping keeps them in lockstep.
      codeql-action:
        patterns:
          - 'github/codeql-action*'
