version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 10
    # vitest majors are gated on @cloudflare/vitest-pool-workers, which peers
    # vitest/@vitest/runner/@vitest/snapshot at a single major (0.22.0: ^4.1.0).
    # The whole suite runs inside that pool, so a vitest major bump can't install
    # (npm ci ERESOLVE, #1097) until a pool-workers release widens the peer range.
    # Lift this ignore when it does, and bump vitest + pool-workers together.
    ignore:
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/*'
        update-types: ['version-update:semver-major']
    groups:
      cloudflare:
        patterns:
          - '@cloudflare/*'
          - 'wrangler'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    groups:
      # github/codeql-action/init and .../analyze are ONE action published from one
      # repo, and they must run at the SAME version: init writes a config file
      # stamped with its own version, and analyze hard-fails reading it back with
      # "Loaded a configuration file for version 'X', but running version 'Y'".
      # Dependabot keys the github-actions ecosystem on the full action path, so
      # without this group it opens a separate PR per sub-action — each one
      # internally version-mismatched and therefore red on arrival. This split has
      # recurred on every codeql-action release (v4.37.0 #499/#500,
      # v4.37.3 #536/#538, v4.37.4 #627/#628). Grouping keeps them in lockstep.
      codeql-action:
        patterns:
          - 'github/codeql-action*'
