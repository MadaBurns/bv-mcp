name: Symlink escape gate

# Fail PRs/pushes whose tracked files include a symlink resolving outside the
# repository root (CWE-61 — the primitive behind "GhostApproval", Wiz
# 2026-07-08: a malicious repo ships e.g. config.json -> ../../../.ssh/authorized_keys,
# and an AI coding agent's confirmation dialog shows the fake in-repo path
# while the write lands outside the workspace). Self-applied (push/pull_request)
# and reusable (workflow_call) — self-contained bash, no external script fetch,
# so public repos can consume it without needing read access to private bv-cc
# (the canonical, locally-runnable copy of this check lives there as
# tools/lint-symlink-escape.mjs — kept in lockstep by hand, not by import).
#
# DIVERGENCE FROM bv-cc's tools/lint-symlink-escape.mjs (added 2026-07-27,
# bv-mcp symlink-hardening follow-up to #576/#579): this workflow gained a
# SECOND, separate `symlink-portability` job below that bv-cc's canonical
# copy does NOT have. It closes two gaps the escape-only rule above missed,
# independently, on the exact incident that motivated it (a tracked
# node_modules symlink with an absolute, machine-specific target that
# resolved on the authoring machine but pointed at a DIFFERENT checkout's
# installed packages):
#   (a) the escape rule above deliberately exempts absolute targets (see its
#       own comment) — correct for its CWE-61/relative-traversal threat
#       model, but it lets an absolute-target symlink sail through clean;
#   (b) the escape rule's `find ... -prune` enumeration (below) prunes
#       anything literally NAMED node_modules — including a symlink named
#       node_modules — before it is ever examined.
# When reconciling these two workflows by hand: either port the
# symlink-portability job to bv-cc's tools/lint-symlink-escape.mjs and
# re-establish lockstep, or record there that bv-mcp intentionally carries
# this additional rule.
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  symlink-escape:
    name: No symlinks escape the repo root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan for escaping symlinks
        run: |
          set -euo pipefail
          ROOT="$(pwd)"
          VIOLATIONS=0

          while IFS= read -r -d '' link; do
            target=$(readlink "$link")

            case "$target" in
              '~'*)
                echo "::error file=$link::SYMLINK_ESCAPE — home-relative (~) target (-> $target)"
                VIOLATIONS=$((VIOLATIONS+1))
                continue
                ;;
              /*)
                # Plain absolute targets aren't flagged — near-universal in real
                # repos (venv interpreters, vendored binaries) and can't reliably
                # generalize across machines/usernames the way relative
                # traversal does, so they aren't the GhostApproval primitive.
                continue
                ;;
            esac

            # Pure lexical resolution (no filesystem access) — a multi-hop
            # chain must be judged one hop at a time, exactly like the
            # canonical tools/lint-symlink-escape.mjs's path.resolve/relative.
            # `realpath` would wrongly dereference any *existing* intermediate
            # symlink and conflate a harmless chain (e.g. venv's
            # bin/python3 -> python -> /abs/real/python) into a false escape.
            rel=$(python3 -c 'import os, sys; root, link, target = sys.argv[1], sys.argv[2], sys.argv[3]; resolved = os.path.normpath(os.path.join(os.path.dirname(link), target)); print(os.path.relpath(resolved, root))' "$ROOT" "$link" "$target")
            case "$rel" in
              ..|../*)
                echo "::error file=$link::SYMLINK_ESCAPE — relative target escapes repository root via ../ traversal (-> $target)"
                VIOLATIONS=$((VIOLATIONS+1))
                ;;
            esac
          done < <(find . \( -name .git -o -name node_modules \) -prune -o -type l -print0)

          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "symlink-escape: $VIOLATIONS violation(s)."
            exit 1
          fi
          echo "symlink-escape: no violations."

  symlink-portability:
    name: No tracked symlinks have machine-specific targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Separate rationale from the escape job above: this is NOT a security
      # check (no CWE-61 traversal concern here) — it's a portability check.
      # ANY tracked symlink whose target is absolute or ~-relative is
      # machine-specific and wrong on every clone other than the one that
      # authored it, independent of where it happens to point. On the
      # authoring machine it can even resolve successfully — to the WRONG
      # thing — which is exactly what happened in #576: a committed
      # node_modules symlink with an absolute target silently pointed one
      # session's workspace package at a DIFFERENT checkout's installed
      # version, corrupting that session's test results without any error.
      - name: Scan for portability-breaking symlinks (absolute / ~ targets)
        run: |
          set -euo pipefail
          VIOLATIONS=0

          # Enumerate via the git TREE (git ls-tree -r HEAD), never `find`.
          # This is the load-bearing property: `find ... -prune` (used by
          # the escape-rule step above) prunes any path literally NAMED
          # node_modules before it is ever examined — including a symlink
          # named node_modules, which is exactly how the escape rule missed
          # the #576 incident. A tree/index scan filtered by git's own mode
          # field (120000 = symlink) has no prune step to get wrong: every
          # tracked entry is enumerated by MODE, not by name, so a symlink
          # can never hide behind a pruned directory name. Do NOT
          # "optimise" this back to `find` — that would silently
          # reintroduce the exact bug this job exists to close.
          while IFS= read -r link; do
            target=$(git cat-file -p "HEAD:$link")

            case "$target" in
              /*|'~'*)
                echo "::error file=$link::SYMLINK_PORTABILITY — tracked symlink has a machine-specific target (-> $target). An absolute or ~-relative target is wrong on every clone but the one that authored it, regardless of where it points."
                VIOLATIONS=$((VIOLATIONS+1))
                ;;
            esac
          done < <(git ls-tree -r HEAD | awk '$1 == "120000" { print $4 }')

          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "symlink-portability: $VIOLATIONS violation(s)."
            exit 1
          fi
          echo "symlink-portability: no violations."
