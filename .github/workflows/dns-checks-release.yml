name: Release dns-checks contract

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact dns-checks package version to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dns-checks-v${{ inputs.version }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build --workspace=packages/dns-checks

      - name: Verify exact tagged version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          ACTUAL_VERSION="$(node -p "require('./packages/dns-checks/package.json').version")"
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION"
          # A release commit can carry BOTH vX.Y.Z and dns-checks-vA.B.C (#1213); `describe
          # --exact-match` returns only one of them, so match against every tag on HEAD (#1226).
          git tag --points-at HEAD | grep -qx "dns-checks-v$EXPECTED_VERSION"

      - name: Pack immutable artifact and checksum
        id: pack
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # The filename is derived, not parsed. `npm pack --json` writes its payload to
          # the SAME stdout the package's own prepack lifecycle script writes to, so any
          # progress line from that script lands in front of the JSON and `jq` dies with
          # `Invalid numeric literal` — which is exactly how the first use of this
          # workflow since 1.0.0 failed, after every gate before it had passed. The
          # prepack script now logs to stderr, and this step no longer depends on that
          # remaining true. npm's name is deterministic: the scope is stripped and the
          # exact version appended, which is the same name the bv-web-prod vendor script
          # independently asserts.
          TARBALL="blackveil-dns-checks-$VERSION.tgz"
          npm pack --workspace=packages/dns-checks
          test -f "$TARBALL"
          SHA256="$(sha256sum "$TARBALL" | cut -d ' ' -f 1)"
          printf '%s  %s\n' "$SHA256" "$TARBALL" > "$TARBALL.sha256"
          printf 'tarball=%s\nsha256=%s\n' "$TARBALL" "$SHA256" >> "$GITHUB_OUTPUT"

      - name: Create immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: >-
          gh release create "dns-checks-v$VERSION" "$TARBALL" "$TARBALL.sha256"
          --verify-tag --title "@blackveil/dns-checks $VERSION"
          --notes "Immutable scoring artifact. Consumers must verify the attached SHA-256 before installation."

      # Publication and consumer promotion are separate operator actions (#1187).
      # Never dispatch across repositories from this artifact-producing job.
      - name: Record manual bv-web-prod promotion handoff
        env:
          VERSION: ${{ inputs.version }}
          SHA256: ${{ steps.pack.outputs.sha256 }}
        run: |
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          {
            echo "### Manual bv-web-prod promotion required"
            echo
            echo "The artifact was published. Consumer promotion was not requested by this workflow."
            echo "An operator must authorize the consumer promotion workflow or open a reviewed re-vendor PR. See the bv-mcp-release skill."
            echo
            printf 'Version: `%s`\n\nRelease tag: `dns-checks-v%s`\n\nSHA-256: `%s`\n\nTagged source commit: `%s`\n' "$VERSION" "$VERSION" "$SHA256" "$SOURCE_COMMIT"
          } >> "$GITHUB_STEP_SUMMARY"
