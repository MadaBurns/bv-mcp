name: Release dns-checks contract

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact dns-checks package version to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dns-checks-v${{ inputs.version }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build --workspace=packages/dns-checks

      - name: Verify exact tagged version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          ACTUAL_VERSION="$(node -p "require('./packages/dns-checks/package.json').version")"
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION"
          test "$(git describe --tags --exact-match HEAD)" = "dns-checks-v$EXPECTED_VERSION"

      - name: Pack immutable artifact and checksum
        id: pack
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # The filename is derived, not parsed. `npm pack --json` writes its payload to
          # the SAME stdout the package's own prepack lifecycle script writes to, so any
          # progress line from that script lands in front of the JSON and `jq` dies with
          # `Invalid numeric literal` — which is exactly how the first use of this
          # workflow since 1.0.0 failed, after every gate before it had passed. The
          # prepack script now logs to stderr, and this step no longer depends on that
          # remaining true. npm's name is deterministic: the scope is stripped and the
          # exact version appended, which is the same name the bv-web-prod vendor script
          # independently asserts.
          TARBALL="blackveil-dns-checks-$VERSION.tgz"
          npm pack --workspace=packages/dns-checks
          test -f "$TARBALL"
          SHA256="$(sha256sum "$TARBALL" | cut -d ' ' -f 1)"
          printf '%s  %s\n' "$SHA256" "$TARBALL" > "$TARBALL.sha256"
          printf 'tarball=%s\nsha256=%s\n' "$TARBALL" "$SHA256" >> "$GITHUB_OUTPUT"

      - name: Create immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: >-
          gh release create "dns-checks-v$VERSION" "$TARBALL" "$TARBALL.sha256"
          --verify-tag --title "@blackveil/dns-checks $VERSION"
          --notes "Immutable scoring artifact. Consumers must verify the attached SHA-256 before installation."

      # BV_WEB_PROD_REPO_TOKEN has never been provisioned on this repository
      # (#1019), so the dispatch step below always failed the `test -n`
      # guard and the workflow reported `failure` even though the artifact
      # above published correctly. This check step lets the workflow tell
      # the truth: dispatch when the secret exists, otherwise skip with a
      # loud, explicit annotation instead of a silent or misleading pass.
      - name: Check bv-web-prod promotion secret
        id: promotion-secret
        env:
          TOKEN: ${{ secrets.BV_WEB_PROD_REPO_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Request bv-web-prod promotion PR
        if: steps.promotion-secret.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.BV_WEB_PROD_REPO_TOKEN }}
          VERSION: ${{ inputs.version }}
          SHA256: ${{ steps.pack.outputs.sha256 }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          test -n "$GH_TOKEN"
          gh api repos/MadaBurns/bv-web-prod/dispatches --method POST \
            -f event_type=dns-checks-released \
            -f "client_payload[version]=$VERSION" \
            -f "client_payload[sha256]=$SHA256" \
            -f "client_payload[source_commit]=$SOURCE_COMMIT" \
            -f "client_payload[release_tag]=dns-checks-v$VERSION"

      # Absent-secret and broken-dispatch stay distinguishable: this step
      # only runs (and only ever succeeds) when the secret is missing. If
      # the secret IS present, the step above runs instead and fails loudly
      # like any other step when `gh api` errors.
      - name: Skip bv-web-prod promotion PR (secret not configured)
        if: steps.promotion-secret.outputs.present != 'true'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "::warning::Skipping bv-web-prod promotion dispatch — the BV_WEB_PROD_REPO_TOKEN secret is not configured on this repository. The repository_dispatch to MadaBurns/bv-web-prod (event_type=dns-checks-released, version=$VERSION) was NOT sent; the promotion PR must be raised by hand for this release."
          {
            echo "### bv-web-prod promotion NOT dispatched"
            echo
            echo "\`BV_WEB_PROD_REPO_TOKEN\` is not configured on this repository, so the cross-repo \`repository_dispatch\` to \`MadaBurns/bv-web-prod\` (event_type \`dns-checks-released\`, version \`$VERSION\`) was skipped. The dns-checks release artifact above published successfully — only the automated promotion is missing. An operator must provision the secret (a token with dispatch access to MadaBurns/bv-web-prod) for this step to fire automatically, or the promotion PR must be opened by hand."
          } >> "$GITHUB_STEP_SUMMARY"
