name: Release

# Triggered by pushing a version tag (e.g., git tag v2.2.0 && git push origin v2.2.0)
# All expressions use controlled inputs (tag name, secrets, job outputs) — no user-supplied text.
on:
  push:
    tags:
      - 'v*'

# Least-privilege default — read-only at the workflow scope so OIDC / write
# tokens never leak into the `validate` job (which runs `npm ci` / build / test
# over third-party code). Each job elevates only the scope it needs.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Pre-release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build workspace package
        run: npm -w packages/dns-checks run build

      - name: Cache Rust
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/bv-wasm-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('crates/bv-wasm-core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Build WASM
        working-directory: crates/bv-wasm-core
        run: wasm-pack build --target web

      - name: Validate internal dependency policy
        run: npm run validate:internal-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Security audit
        # --omit=dev: the release artifact is the Cloudflare Worker (production
        # deps only). Dev-tooling advisories don't reach the runtime and must not
        # fail a release's pre-flight; Dependabot tracks them. Mirrors security.yml.
        run: npm audit --omit=dev --audit-level=high

  version-bump:
    name: Verify version matches tag
    needs: validate
    runs-on: ubuntu-latest
    # Read-only: this job verifies, it never writes. Its previous incarnation
    # pushed an auto-bump commit to `main`, which protected-branch rules always
    # reject ("4 of 4 required status checks are expected") — that failed the
    # job on every release since v3.40.0 and skipped ALL downstream publish /
    # deploy / registry jobs, forcing the GitHub Release to be cut by hand.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.extract.outputs.version }}
      changelog: ${{ steps.changelog.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: extract
        name: Extract version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

      # The supported release path is to pre-bump locally before tagging (see
      # CLAUDE.md "Release"). This gate ASSERTS that happened rather than trying
      # to fix it up in CI, and deliberately rewrites nothing.
      #
      # Why not rewrite: the old step re-serialized server.json with
      # `JSON.stringify(o, null, '\t')`, reindenting a 2-space file to tabs. The
      # `git diff --cached --quiet` no-op guard is a BYTE test, so that
      # whitespace-only churn made it take the "version changed" branch and push
      # even when the version already matched the tag — which is exactly why the
      # documented "pre-bump so this becomes a no-op" workaround never worked.
      #
      # SERVER_VERSION is not checked: src/lib/server-version.ts auto-derives it
      # from package.json (`export const SERVER_VERSION: string = pkg.version;`).
      - name: Verify version surfaces match tag
        env:
          VERSION: ${{ steps.extract.outputs.version }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          LOCK=$(node -p "require('./package-lock.json').version")
          SRV=$(node -p "require('./server.json').version")
          fail=0
          [ "$PKG" = "$VERSION" ] || { echo "::error::package.json is $PKG, expected $VERSION"; fail=1; }
          [ "$LOCK" = "$VERSION" ] || { echo "::error::package-lock.json is $LOCK, expected $VERSION"; fail=1; }
          [ "$SRV" = "$VERSION" ] || { echo "::error::server.json is $SRV, expected $VERSION"; fail=1; }
          # server.json is currently remotes-only. If an npm `packages` stanza is
          # ever re-added it carries its own version that must match too.
          PKGVER=$(node -p "const o=require('./server.json'); o.packages && o.packages[0] ? o.packages[0].version : ''")
          if [ -n "$PKGVER" ] && [ "$PKGVER" != "$VERSION" ]; then
            echo "::error::server.json packages[0].version is $PKGVER, expected $VERSION"
            fail=1
          fi
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "::error::no CHANGELOG.md entry for $VERSION"; fail=1; }
          if [ "$fail" -ne 0 ]; then
            echo "::error::Version surfaces disagree with tag v$VERSION. Pre-bump locally before tagging (see CLAUDE.md \"Release\"), then move the tag."
            exit 1
          fi
          echo "All version surfaces match $VERSION."

      - id: changelog
        name: Extract changelog for this version
        env:
          VERSION: ${{ steps.extract.outputs.version }}
        run: |
          BODY=$(awk "/^## \[$VERSION\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="Release $VERSION"
            echo "::warning::No CHANGELOG entry found for $VERSION"
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  publish-npm:
    name: Publish to npm
    needs: version-bump
    runs-on: ubuntu-latest
    environment: production
    # `id-token: write` mints the OIDC token for `npm publish --provenance`.
    # A job-level `permissions:` block REPLACES the default (un-listed scopes
    # become `none`), so `contents: read` must be restated for checkout.
    permissions:
      contents: read
      id-token: write
    # This job was gated off with `if: false` during an `NPM_TOKEN` rotation and
    # stayed off for ~46 minor versions (#719). The rot was invisible because a
    # skipped job is GREEN: the release workflow reported success while npm went
    # stale. Every failure mode below is therefore made LOUD — a missing or
    # invalid token fails the job before any build work, and nothing here
    # warn-and-skips. Do not reintroduce a silent gate; if npm publishing must be
    # paused, delete the job or fail it explicitly with a reason.
    steps:
      # Fails BEFORE checkout/build so a missing secret costs seconds, not a
      # full release build, and the error is the first thing in the log.
      - name: Preflight — NPM_TOKEN is present
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error title=NPM_TOKEN missing::NPM_TOKEN is not set in the 'production' environment. Create an npm automation token with publish rights to BOTH 'blackveil-dns' and '@blackveil/dns-checks', then: gh secret set NPM_TOKEN --env production"
            exit 1
          fi
          # Automation tokens are opaque, but a value carrying whitespace or a
          # quote is a paste accident that would otherwise surface as an
          # inscrutable 404 at publish time (npm answers 404 for auth misses).
          case "$NPM_TOKEN" in
            *[[:space:]]* | *\"* | *\'*)
              echo "::error title=NPM_TOKEN malformed::NPM_TOKEN contains whitespace or quote characters — re-set it without surrounding quotes or a trailing newline."
              exit 1
              ;;
          esac
          echo "NPM_TOKEN is present (${#NPM_TOKEN} chars)."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # Presence is not validity. A rotated-away token authenticates as nobody
      # and npm reports the resulting publish miss as a 404, which reads like a
      # package-name problem rather than an auth problem. Prove the token
      # resolves to a user here, where the error message can say so.
      - name: Preflight — NPM_TOKEN authenticates
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ! WHO=$(npm whoami --registry=https://registry.npmjs.org/ 2>&1); then
            echo "::error title=NPM_TOKEN invalid::npm whoami failed — the token is expired, revoked, or lacks read access. Response: ${WHO}"
            exit 1
          fi
          echo "Authenticated to npm as: ${WHO}"

      - run: npm ci

      - name: Build workspace package
        run: npm -w packages/dns-checks run build

      - run: npm run build

      # Idempotent by design: a release can half-publish (root succeeds, the
      # workspace package fails) and the retry must not die on
      # `EPUBLISHCONFLICT` for the half that already landed. An ALREADY-PRESENT
      # version is logged and skipped; any other publish failure still fails the
      # job. This never overwrites a published version — npm forbids that.
      - name: Publish blackveil-dns
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.version-bump.outputs.version }}
        run: |
          if npm view "blackveil-dns@${VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "::notice title=blackveil-dns already published::blackveil-dns@${VERSION} is already on the registry — skipping publish (re-run safe)."
          else
            npm publish --provenance --access public
          fi

      - name: Publish @blackveil/dns-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # The workspace package versions independently of the root release
          # tag, so read its own manifest rather than reusing $VERSION.
          PKG_VERSION=$(node -p "require('./packages/dns-checks/package.json').version")
          if npm view "@blackveil/dns-checks@${PKG_VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "::notice title=@blackveil/dns-checks already published::@blackveil/dns-checks@${PKG_VERSION} is already on the registry — skipping publish (re-run safe)."
          else
            npm -w packages/dns-checks publish --provenance --access public
          fi

      - name: Verify published versions
        env:
          VERSION: ${{ needs.version-bump.outputs.version }}
        run: |
          # Assert against the REGISTRY, not against a green step (#719
          # acceptance criterion). npm's read path is CDN-cached, so allow a
          # short settle before failing.
          PKG_VERSION=$(node -p "require('./packages/dns-checks/package.json').version")
          fail=0
          for spec in "blackveil-dns@${VERSION}" "@blackveil/dns-checks@${PKG_VERSION}"; do
            ok=0
            for _ in 1 2 3 4 5 6; do
              if npm view "$spec" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
                ok=1
                break
              fi
              sleep 10
            done
            if [ "$ok" -eq 1 ]; then
              echo "Verified on registry: $spec"
            else
              echo "::error title=Publish not visible::${spec} is not resolvable on registry.npmjs.org after publish."
              fail=1
            fi
          done
          [ "$fail" -eq 0 ]

  # NOTE (#718): this workflow deliberately has NO Cloudflare deploy job.
  #
  # It used to carry `deploy-cloudflare`, whose first step was `exit 1` "by
  # design" — while the job still declared `environment: production`. So every
  # tagged release parked a genuine approval prompt on a job that could only
  # fail if approved, and two were left standing (runs 31980523639 / 32298225966,
  # v3.52.0 and v3.55.0, both `waiting` with a pending `production` deployment).
  # Standing approval prompts that must be ignored erode the ones that matter.
  #
  # The job was NOT reinstated as a real deploy: its body shipped the PUBLIC
  # `wrangler.jsonc` straight from CI, with no private overlay injected —
  # precisely the defect that got `auto-deploy-main.yml` deleted (a
  # Worker missing every KV/D1/R2/Analytics/service binding). Its two useful
  # pieces, the infra-probe deploy and the OAuth prod-probe verification, moved
  # to `deploy-prod.yml`, where they sit behind the real overlay-reconstructing
  # deploy instead of behind an `exit 1` that had never let them run.
  #
  # Releases tag and publish here; shipping the Worker is `deploy-prod.yml` (or
  # `npm run deploy:prod` by hand). One deploy path, deliberately.

  github-release:
    name: Create GitHub Release
    needs: version-bump
    runs-on: ubuntu-latest
    # `gh release create` needs write to create the release object.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version-bump.outputs.version }}
          CHANGELOG_BODY: ${{ needs.version-bump.outputs.changelog }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes "$CHANGELOG_BODY" \
            --verify-tag

  publish-registry:
    name: Publish to MCP Registry
    needs: [validate, version-bump]
    runs-on: ubuntu-latest
    environment: production
    # Was gated off in lockstep with publish-npm (#719) and re-enabled with it.
    #
    # It does NOT depend on publish-npm: `server.json` is remotes-only, so the
    # registry's npm-existence check ("NPM package 'blackveil-dns' not found
    # (status: 404)") does not apply to this listing. The two publishes are
    # independent and a failure in one must not silently withhold the other.
    # ⚠️ If an npm `packages` stanza is ever re-added to server.json, that check
    # returns and this job must then `needs: publish-npm`.
    steps:
      - name: Check publisher key
        env:
          MCP_PUBLISHER_KEY: ${{ secrets.MCP_PUBLISHER_KEY }}
        run: |
          if [ -z "$MCP_PUBLISHER_KEY" ]; then
            echo "::error::MCP_PUBLISHER_KEY not configured in production environment"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # DNS-based login + publish (com.blackveilsecurity/* namespace requires
      # ed25519 ownership proof at the apex blackveilsecurity.com TXT — see
      # CLAUDE.md "MCP Registry DNS auth"). The previous design used a
      # long-lived JWT in MCP_REGISTRY_TOKEN, which expired silently and went
      # unnoticed because publish.yml warn-and-skipped on missing secrets.
      # `mcp-publisher` is a Go binary distributed via GitHub releases at
      # modelcontextprotocol/registry — NOT an npm package. `npx mcp-publisher`
      # 404s. Pin to a known-good version; bump deliberately.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: '1.7.8'
          MCP_PUBLISHER_SHA256: '48230dbec85bd88a0d42977ef533cddda23235f0db4331b9263ce53b432cb75c'
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" -o mcp-publisher.tar.gz
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          sudo tar -xzf mcp-publisher.tar.gz -C /usr/local/bin mcp-publisher
          rm mcp-publisher.tar.gz
          mcp-publisher --version

      - name: Login + publish to registry
        env:
          MCP_PUBLISHER_KEY: ${{ secrets.MCP_PUBLISHER_KEY }}
        run: |
          mcp-publisher login dns --domain blackveilsecurity.com --private-key "$MCP_PUBLISHER_KEY"
          mcp-publisher publish
