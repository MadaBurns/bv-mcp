name: Release

# Triggered by pushing a version tag (e.g., git tag v2.2.0 && git push origin v2.2.0)
# All expressions use controlled inputs (tag name, secrets, job outputs) — no user-supplied text.
on:
  push:
    tags:
      - 'v*'

# Least-privilege default — read-only at the workflow scope so OIDC / write
# tokens never leak into the `validate` job (which runs `npm ci` / build / test
# over third-party code). Each job elevates only the scope it needs.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Pre-release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build workspace package
        run: npm -w packages/dns-checks run build

      - name: Cache Rust
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/bv-wasm-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('crates/bv-wasm-core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Build WASM
        working-directory: crates/bv-wasm-core
        run: wasm-pack build --target web

      - name: Validate internal dependency policy
        run: npm run validate:internal-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Security audit
        # --omit=dev: the release artifact is the Cloudflare Worker (production
        # deps only). Dev-tooling advisories don't reach the runtime and must not
        # fail a release's pre-flight; Dependabot tracks them. Mirrors security.yml.
        run: npm audit --omit=dev --audit-level=high

  version-bump:
    name: Verify version matches tag
    needs: validate
    runs-on: ubuntu-latest
    # Read-only: this job verifies, it never writes. Its previous incarnation
    # pushed an auto-bump commit to `main`, which protected-branch rules always
    # reject ("4 of 4 required status checks are expected") — that failed the
    # job on every release since v3.40.0 and skipped ALL downstream publish /
    # deploy / registry jobs, forcing the GitHub Release to be cut by hand.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.extract.outputs.version }}
      changelog: ${{ steps.changelog.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: extract
        name: Extract version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

      # The supported release path is to pre-bump locally before tagging (see
      # CLAUDE.md "Release"). This gate ASSERTS that happened rather than trying
      # to fix it up in CI, and deliberately rewrites nothing.
      #
      # Why not rewrite: the old step re-serialized server.json with
      # `JSON.stringify(o, null, '\t')`, reindenting a 2-space file to tabs. The
      # `git diff --cached --quiet` no-op guard is a BYTE test, so that
      # whitespace-only churn made it take the "version changed" branch and push
      # even when the version already matched the tag — which is exactly why the
      # documented "pre-bump so this becomes a no-op" workaround never worked.
      #
      # SERVER_VERSION is not checked: src/lib/server-version.ts auto-derives it
      # from package.json (`export const SERVER_VERSION: string = pkg.version;`).
      - name: Verify version surfaces match tag
        env:
          VERSION: ${{ steps.extract.outputs.version }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          LOCK=$(node -p "require('./package-lock.json').version")
          SRV=$(node -p "require('./server.json').version")
          fail=0
          [ "$PKG" = "$VERSION" ] || { echo "::error::package.json is $PKG, expected $VERSION"; fail=1; }
          [ "$LOCK" = "$VERSION" ] || { echo "::error::package-lock.json is $LOCK, expected $VERSION"; fail=1; }
          [ "$SRV" = "$VERSION" ] || { echo "::error::server.json is $SRV, expected $VERSION"; fail=1; }
          # server.json is currently remotes-only. If an npm `packages` stanza is
          # ever re-added it carries its own version that must match too.
          PKGVER=$(node -p "const o=require('./server.json'); o.packages && o.packages[0] ? o.packages[0].version : ''")
          if [ -n "$PKGVER" ] && [ "$PKGVER" != "$VERSION" ]; then
            echo "::error::server.json packages[0].version is $PKGVER, expected $VERSION"
            fail=1
          fi
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "::error::no CHANGELOG.md entry for $VERSION"; fail=1; }
          if [ "$fail" -ne 0 ]; then
            echo "::error::Version surfaces disagree with tag v$VERSION. Pre-bump locally before tagging (see CLAUDE.md \"Release\"), then move the tag."
            exit 1
          fi
          echo "All version surfaces match $VERSION."

      - id: changelog
        name: Extract changelog for this version
        env:
          VERSION: ${{ steps.extract.outputs.version }}
        run: |
          BODY=$(awk "/^## \[$VERSION\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="Release $VERSION"
            echo "::warning::No CHANGELOG entry found for $VERSION"
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  publish-npm:
    name: Publish to npm
    needs: version-bump
    runs-on: ubuntu-latest
    environment: production
    # `id-token: write` mints the OIDC token for `npm publish --provenance`.
    # A job-level `permissions:` block REPLACES the default (un-listed scopes
    # become `none`), so `contents: read` must be restated for checkout.
    permissions:
      contents: read
      id-token: write
    # Gated off while the production `NPM_TOKEN` is being rotated. The hosted
    # token returned 404 on `npm publish` for v2.24.0 (npm reports 404 for
    # auth-shaped misses). Re-enable by deleting this `if:` line once a fresh
    # token with publish rights to both `blackveil-dns` and
    # `@blackveil/dns-checks` is in the production env. Releases are running
    # via the manual fallback in the meantime.
    if: false
    steps:
      - name: Check npm token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN not configured in production environment"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Build workspace package
        run: npm -w packages/dns-checks run build

      - run: npm run build

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @blackveil/dns-checks
        run: npm -w packages/dns-checks publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # NOTE (#718): this workflow deliberately has NO Cloudflare deploy job.
  #
  # It used to carry `deploy-cloudflare`, whose first step was `exit 1` "by
  # design" — while the job still declared `environment: production`. So every
  # tagged release parked a genuine approval prompt on a job that could only
  # fail if approved, and two were left standing (runs 31980523639 / 32298225966,
  # v3.52.0 and v3.55.0, both `waiting` with a pending `production` deployment).
  # Standing approval prompts that must be ignored erode the ones that matter.
  #
  # The job was NOT reinstated as a real deploy: its body shipped the PUBLIC
  # `wrangler.jsonc` straight from CI, with no private overlay injected —
  # precisely the defect that got `auto-deploy-main.yml` deleted (a
  # Worker missing every KV/D1/R2/Analytics/service binding). Its two useful
  # pieces, the infra-probe deploy and the OAuth prod-probe verification, moved
  # to `deploy-prod.yml`, where they sit behind the real overlay-reconstructing
  # deploy instead of behind an `exit 1` that had never let them run.
  #
  # Releases tag and publish here; shipping the Worker is `deploy-prod.yml` (or
  # `npm run deploy:prod` by hand). One deploy path, deliberately.

  github-release:
    name: Create GitHub Release
    needs: version-bump
    runs-on: ubuntu-latest
    # `gh release create` needs write to create the release object.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version-bump.outputs.version }}
          CHANGELOG_BODY: ${{ needs.version-bump.outputs.changelog }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes "$CHANGELOG_BODY" \
            --verify-tag

  publish-registry:
    name: Publish to MCP Registry
    needs: [validate, version-bump]
    runs-on: ubuntu-latest
    environment: production
    # Gated off in lockstep with publish-npm. The MCP Registry validates that
    # the npm package version exists before publishing, so this job cascades to
    # `NPM package 'blackveil-dns' not found (status: 404)` whenever npm is
    # stale. Re-enable together with publish-npm once `NPM_TOKEN` is rotated.
    if: false
    steps:
      - name: Check publisher key
        env:
          MCP_PUBLISHER_KEY: ${{ secrets.MCP_PUBLISHER_KEY }}
        run: |
          if [ -z "$MCP_PUBLISHER_KEY" ]; then
            echo "::error::MCP_PUBLISHER_KEY not configured in production environment"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # DNS-based login + publish (com.blackveilsecurity/* namespace requires
      # ed25519 ownership proof at the apex blackveilsecurity.com TXT — see
      # CLAUDE.md "MCP Registry DNS auth"). The previous design used a
      # long-lived JWT in MCP_REGISTRY_TOKEN, which expired silently and went
      # unnoticed because publish.yml warn-and-skipped on missing secrets.
      # `mcp-publisher` is a Go binary distributed via GitHub releases at
      # modelcontextprotocol/registry — NOT an npm package. `npx mcp-publisher`
      # 404s. Pin to a known-good version; bump deliberately.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: '1.7.8'
          MCP_PUBLISHER_SHA256: '48230dbec85bd88a0d42977ef533cddda23235f0db4331b9263ce53b432cb75c'
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" -o mcp-publisher.tar.gz
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          sudo tar -xzf mcp-publisher.tar.gz -C /usr/local/bin mcp-publisher
          rm mcp-publisher.tar.gz
          mcp-publisher --version

      - name: Login + publish to registry
        env:
          MCP_PUBLISHER_KEY: ${{ secrets.MCP_PUBLISHER_KEY }}
        run: |
          mcp-publisher login dns --domain blackveilsecurity.com --private-key "$MCP_PUBLISHER_KEY"
          mcp-publisher publish
