name: Registry Drift Check

# Advisory only — NOT a required check, NOT in branch protection. Follows the
# dns-security.yml convention of a $0, informational workflow.
#
# Detects drift between the live production serverInfo.version and the MCP
# Registry's `?version=latest` listing. DETECTION ONLY: this workflow must
# NEVER publish anything — no mcp-publisher, no `npm run publish:registry`,
# no write call to the registry of any kind. It only reads two public
# endpoints and opens/updates/closes a GitHub issue.
#
# Context (2026-08-26): publish.yml validates a release tag and creates the
# GitHub Release, but it no longer contains publish jobs. Publishing is an
# operator-run step. The issue body below points directly to the authoritative
# manual `npm run publish:registry` path from a worktree pinned to the tag.
#
# No `uses:` actions anywhere in this file — curl/jq/gh are preinstalled on
# ubuntu-latest and there is nothing to check out, so both the F11 SHA-pin
# audit (test/audits/workflow-permissions.audit.test.ts) and the gitleaks
# phone-number-in-a-SHA trap are structurally inapplicable.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}

concurrency:
  group: registry-drift-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Fetch live serverInfo.version
        id: live
        run: |
          RESPONSE=$(curl -sS -X POST https://dns-mcp.blackveilsecurity.com/mcp \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"registry-drift-check","version":"1.0.0"}}}')
          VERSION=$(echo "$RESPONSE" | jq -r '.result.serverInfo.version // empty')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract live serverInfo.version. Response: $RESPONSE"
            exit 1
          fi
          echo "Live serverInfo.version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Fetch MCP Registry version
        id: registry
        run: |
          CACHEBUST=$(date +%s)
          RESPONSE=$(curl -sS "https://registry.modelcontextprotocol.io/v0/servers?search=com.blackveilsecurity/dns&version=latest&_cb=${CACHEBUST}")
          VERSION=$(echo "$RESPONSE" | jq -r '.servers[0].server.version // empty')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract registry version. Response: $RESPONSE"
            exit 1
          fi
          echo "Registry version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # `gh issue create --label X` FAILS if X does not already exist — it does
      # not create labels implicitly, and the failure is fatal (the issue is not
      # created at all). Creating them here keeps the workflow self-sufficient in
      # a fresh fork or self-host rather than depending on repo state someone set
      # up by hand. `--force` makes it idempotent: create if absent, update if not.
      - name: Ensure drift labels exist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh label create registry-drift --repo "$REPO" --force \
            --color D93F0B --description "MCP Registry listing has drifted from live prod"
          gh label create priority-high --repo "$REPO" --force \
            --color B60205 --description "Escalated: needs attention now"

      - name: Compare versions and act
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_VERSION: ${{ steps.live.outputs.version }}
          REGISTRY_VERSION: ${{ steps.registry.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          echo "live=${LIVE_VERSION} registry=${REGISTRY_VERSION}"

          HIGHEST=$(printf '%s\n%s\n' "$LIVE_VERSION" "$REGISTRY_VERSION" | sort -V | tail -n1)

          EXISTING_ISSUE=$(gh issue list --repo "$REPO" --label registry-drift --state open --json number --jq '.[0].number // empty')

          RUN_URL="${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"

          if [ "$LIVE_VERSION" = "$REGISTRY_VERSION" ]; then
            echo "Registry matches live (${LIVE_VERSION}) - no drift."
            if [ -n "$EXISTING_ISSUE" ]; then
              gh issue comment "$EXISTING_ISSUE" --repo "$REPO" --body "Resolved: registry now matches live (\`${LIVE_VERSION}\`). Closing."
              gh issue close "$EXISTING_ISSUE" --repo "$REPO"
            fi
            exit 0
          fi

          if [ "$HIGHEST" = "$REGISTRY_VERSION" ]; then
            # Registry AHEAD of live. Structurally should not happen (the
            # registry only ever advances via publishing an already-deployed
            # version) - unsafe direction, no grace period, fail immediately.
            # Built via printf -v (not a heredoc): a heredoc body written at
            # column 0 would be LESS indented than this `run: |` block scalar
            # and would terminate it early - YAML has no concept of a bash
            # heredoc, it just sees under-indented lines.
            printf -v BODY '%s\n' \
              "### MCP Registry is AHEAD of live production - unsafe direction" \
              "" \
              "- Live \`serverInfo.version\` (dns-mcp.blackveilsecurity.com): \`${LIVE_VERSION}\`" \
              "- Registry \`?version=latest\` (registry.modelcontextprotocol.io): \`${REGISTRY_VERSION}\`" \
              "" \
              "This should not be possible under normal operation and needs immediate" \
              "operator investigation. Do **not** try to \"fix\" this by publishing again" \
              "until you understand how the registry got ahead of the deployed worker." \
              "" \
              "This workflow never publishes anything itself - detection only." \
              "" \
              "_Workflow: \`registry-drift-check.yml\`, run: ${RUN_URL}_"
            if [ -n "$EXISTING_ISSUE" ]; then
              gh issue comment "$EXISTING_ISSUE" --repo "$REPO" --body "$BODY"
              gh issue edit "$EXISTING_ISSUE" --repo "$REPO" --add-label priority-high
            else
              gh issue create --repo "$REPO" \
                --title "Registry drift: registry AHEAD of live (${REGISTRY_VERSION} > ${LIVE_VERSION})" \
                --label registry-drift --label priority-high \
                --body "$BODY"
            fi
            echo "::error::Registry version (${REGISTRY_VERSION}) is ahead of live (${LIVE_VERSION}) - failing immediately."
            exit 1
          fi

          # Registry BEHIND live.
          printf -v BODY '%s\n' \
            "### MCP Registry is behind live production" \
            "" \
            "- Live \`serverInfo.version\` (dns-mcp.blackveilsecurity.com): \`${LIVE_VERSION}\`" \
            "- Registry \`?version=latest\` (registry.modelcontextprotocol.io): \`${REGISTRY_VERSION}\`" \
            "" \
            "Publishing is operator-run. \`publish.yml\` validates the tag and creates" \
            "the GitHub Release only; it does not publish to the MCP Registry." \
            "" \
            "1. Confirm the \`v${LIVE_VERSION}\` tag identifies the deployed release." \
            "2. From a fresh worktree pinned to that exact tag, follow CLAUDE.md" \
            "   (\"Release\") and run \`npm run publish:registry\`. The integrity gate" \
            "   deliberately refuses a dirty or untagged checkout." \
            "3. Query the Registry with a cache-buster and verify it reports" \
            "   \`${LIVE_VERSION}\` before closing this issue." \
            "" \
            "This workflow never publishes anything itself - detection only." \
            "" \
            "_Workflow: \`registry-drift-check.yml\`, run: ${RUN_URL}_"
          if [ -n "$EXISTING_ISSUE" ]; then
            gh issue comment "$EXISTING_ISSUE" --repo "$REPO" --body "$BODY"
            gh issue edit "$EXISTING_ISSUE" --repo "$REPO" --add-label priority-high
            echo "::error::Registry drift (behind live) has survived a full cycle - failing."
            exit 1
          else
            gh issue create --repo "$REPO" \
              --title "Registry drift: registry behind live (${REGISTRY_VERSION} < ${LIVE_VERSION})" \
              --label registry-drift \
              --body "$BODY"
            echo "First sighting of registry-behind-live drift - tracking issue opened, exiting green (normal in the deploy-to-publish window)."
            exit 0
          fi
